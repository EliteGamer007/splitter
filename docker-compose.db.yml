version: '3.8'

services:
  db:
    image: postgres:15
    container_name: splitter-db
    environment:
      POSTGRES_USER: splitter
      POSTGRES_PASSWORD: splitteradmin
      POSTGRES_DB: neondb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitter -d neondb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
