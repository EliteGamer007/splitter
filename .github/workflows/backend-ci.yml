name: Backend CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: splitter_repair
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: splitter_repair_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splitter_repair -d splitter_repair_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENV_FILE: /nonexistent/no-production-env
      TEST_DATABASE_URL: postgres://splitter_repair:local_ci_only@127.0.0.1:5432/splitter_repair_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Format
        run: |
          unformatted=$(git ls-files '*.go' | xargs gofmt -l)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - run: go vet ./cmd/... ./internal/... ./tests/...
      - name: Complete tests against disposable PostgreSQL
        run: go test -p 1 -count=1 ./cmd/... ./internal/... ./tests/...
      - name: Race-sensitive packages
        run: go test -p 1 -race ./internal/auth ./internal/config ./internal/db ./internal/federation ./internal/handlers ./internal/middleware ./internal/repository ./internal/service
      - name: Build all commands
        run: go build ./cmd/...
